# Configuración de la base de datos MySQL (Soporta local y producción)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Pokemon-tfg?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Madrid}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate (Limpio de warnings antiguos)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración del servidor (Render asigna el puerto automáticamente mediante la variable PORT)
server.port=${PORT:9876}
server.error.include-message=always

# Configuración CORS (Para permitir peticiones desde tu frontend en local o en producción)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT Configuration (Seguridad de tokens)
jwt.secret=${JWT_SECRET:miClaveSecretaParaPokemonTFG2024MuySeguraYLargaParaJWT}
jwt.expiration=86400000
